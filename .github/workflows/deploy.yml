
name: Deploy Website to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy website to STRATO
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STRATO_HOST }}
          username: ${{ secrets.STRATO_USER }}
          password: ${{ secrets.STRATO_PASSWORD }}
          port: 22
          source: "index.html,css/**,js/**,images/**"
          target: ${{ secrets.STRATO_REMOTE_PATH }}
          overwrite: true
