
name: Deploy Website to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload website via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload website files
        uses: Dylan700/sftp-upload-action@v1.2.5
        with:
          server: ${{ secrets.STRATO_HOST }}
          username: ${{ secrets.STRATO_USER }}
          password: ${{ secrets.STRATO_PASSWORD }}
          port: 22
          uploads: |
            ./* => ./
          ignore: |
            .git/**
            .github/**
