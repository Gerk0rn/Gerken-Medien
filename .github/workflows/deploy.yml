
name: Deploy Website to STRATO

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload website to STRATO
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STRATO_HOST }}
          username: ${{ secrets.STRATO_USER }}
          password: ${{ secrets.STRATO_PASSWORD }}
          port: 22
          source: "index.html,css/**,js/**,images/**"
          target: ${{ secrets.STRATO_REMOTE_PATH }}
